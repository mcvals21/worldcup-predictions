<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f4d">
  <title>{{ t.name if t else 'توقعات المباريات' }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<header class="wc-header">
  <div class="wc-hero">
    <div class="wc-kicker">مسابقة الأصدقاء</div>

    <h1>
      <span>🏆</span>
      {{ t.name if t else 'توقعات المباريات' }}
    </h1>

    <p>توقع النتائج، اجمع النقاط، ونافس على الصدارة</p>
  </div>

  <nav class="wc-nav">
    <a href="/leaderboard">🏅 الترتيب</a>
    <a href="{{ url_for('matches_page', filter='open') }}">⚽ المباريات</a>
    <a href="/rules">📖 القوانين</a>
    <a href="{{ url_for('stats') }}">📊 الإحصائيات</a>
  </nav>
</header>

<main>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="flash">{{ messages[0] }}</div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>
</body>
</html>
