<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#112233">
  <title>{{ t.name if t else 'توقعات المباريات' }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <h1>🏆 {{ t.name if t else 'توقعات المباريات' }}</h1>
  <nav><a href="/leaderboard">الترتيب</a></nav>
</header>
<main>
  {% with messages = get_flashed_messages() %}{% if messages %}<div class="flash">{{ messages[0] }}</div>{% endif %}{% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
