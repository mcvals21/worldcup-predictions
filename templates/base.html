<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f4d">
  <title>{{ t.name if t else 'توقعات المباريات' }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<header>
  <div class="site-hero">
    <div>
      <div class="hero-kicker">مسابقة الأصدقاء</div>
      <h1>🏆 {{ t.name if t else 'توقعات المباريات' }}</h1>
      <p>توقع النتائج، اجمع النقاط، ونافس على الصدارة</p>
    </div>
    <div class="hero-ball">⚽</div>
  </div>

  <nav>
    <a href="/leaderboard">🏅 الترتيب</a>
    <a href="/rules">📖 القوانين</a>
  <a href="{{ url_for('matches_page', filter='open') }}">جدول المباريات</a>
  </nav>
</header>

<main>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="flash">{{ messages[0] }}</div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>
</body>
</html>
